
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Admin Password — HA Unity Industries</title>
</head>
<body style="font-family:Arial;max-width:450px;margin:40px auto;padding:20px">
  <h2>Reset Admin Password</h2>
  <p>Enter your new password below.</p>

  <input id="password" type="password"
    placeholder="New password"
    autocomplete="new-password"
    style="width:100%;padding:12px;box-sizing:border-box">

  <button id="reset" style="padding:12px;margin-top:12px">
    Save New Password
  </button>

  <p id="status"></p>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://pdckdoznpzuvonxkxxow.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HnGAJ0Mir7d5KRcvWCS7Ew_8hbwalNxE";

    const supabase = createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const status = document.getElementById("status");

    const params = new URLSearchParams(location.hash.slice(1));
    const accessToken = params.get("access_token");
    const refreshToken = params.get("refresh_token");
    const type = params.get("type");

    if (accessToken && refreshToken && type === "recovery") {
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (error) {
        status.textContent =
          "Recovery link invalid or expired. Request a new one.";
      } else {
        status.textContent = "Enter your new password.";
      }
    } else {
      status.textContent =
        "Open this page using the latest password recovery email link.";
    }

    document.getElementById("reset").addEventListener("click", async () => {
      const password = document.getElementById("password").value;

      if (password.length < 8) {
        status.textContent = "Use at least 8 characters.";
        return;
      }

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        status.textContent = "Password update failed. The recovery link may have expired.";
      } else {
        status.textContent =
          "Password updated successfully. Return to admin.html and log in.";
      }
    });
  </script>
</body>
</html>
