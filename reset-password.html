
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Admin Password — HA Unity Industries</title>
</head>
<body style="font-family:Arial;max-width:450px;margin:40px auto;padding:20px">
  <h2>Reset Admin Password</h2>
  <p>Enter your new password below.</p>

  <input id="password" type="password"
    placeholder="New password"
    autocomplete="new-password"
    style="width:100%;padding:12px;box-sizing:border-box">

  <button id="reset" style="padding:12px;margin-top:12px">
    Save New Password
  </button>

  <p id="status"></p>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://pdckdoznpzuvonxkxxow.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HnGAJ0Mir7d5KRcvWCS7Ew_8hbwalNxE";

   const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      detectSessionInUrl: false
    }
  }
);

    const status = document.getElementById("status");

  
const hashParams = new URLSearchParams(location.hash.slice(1));
const queryParams = new URLSearchParams(location.search);

const accessToken = hashParams.get("access_token");
const refreshToken = hashParams.get("refresh_token");
const type = hashParams.get("type");
const code = queryParams.get("code");
status.textContent =
  "Token: " + (accessToken ? "Present" : "Missing") +
  " | Refresh: " + (refreshToken ? "Present" : "Missing") +
  " | Type: " + (type || "Missing");
const authError = hashParams.get("error_description");
const errorCode = hashParams.get("error_code");

if (authError || errorCode) {
  status.textContent =
    "Recovery link expired or invalid. Request a new link.";
} else if (code) {
  const { error } =
    await supabase.auth.exchangeCodeForSession(code);

  if (error) {
    status.textContent = "Recovery failed: " + error.message;
  } else {
    status.textContent = "Enter your new password.";
  }
} else if (accessToken && refreshToken && type === "recovery") {
  const { error } = await supabase.auth.setSession({
    access_token: accessToken,
    refresh_token: refreshToken
  });

  if (error) {
    status.textContent = "Recovery failed: " + error.message;
  } else {
    status.textContent = "Enter your new password.";
  }
} else {
  status.textContent =
    "Open the latest valid password recovery email link.";
}


    document.getElementById("reset").addEventListener("click", async () => {
      const password = document.getElementById("password").value;

      if (password.length < 8) {
        status.textContent = "Use at least 8 characters.";
        return;
      }

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        status.textContent = "Password update failed: " + error.message;
      } else {
        status.textContent =
          "Password updated successfully. Return to admin.html and log in.";
      }
    });
  </script>
</body>
</html>
